schema_version: 1
policy:
  external_assets_require_review: true
  required_fields:
    - asset_id
    - source
    - author
    - license
    - commercial_use
    - attribution_required
    - original_url
    - local_path

generated_defaults: &openai_generated
  source: OpenAI built-in image generation
  author: Toy Vision project / OpenAI-generated output
  license: OpenAI Terms of Use (output ownership subject to applicable law)
  commercial_use: permitted subject to OpenAI Terms of Use
  attribution_required: false
  original_url: null
  terms_url: https://openai.com/policies/row-terms-of-use/

assets:
