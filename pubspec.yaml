name: toyvision_realtime
description: Tobi Ordena — juego infantil que convierte recoger juguetes en una aventura.
publish_to: "none"
version: 2.1.0+4

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  # On-device detector and CameraX inference surface. The required model is
  # bundled; production never downloads or swaps to a network fallback.
  # License: AGPL-3.0. Personal/prototype use only — commercial closed
  # distribution requires an Ultralytics Enterprise license.
  ultralytics_yolo: 0.4.3
  # Runtime camera permission support for the native inference surface.
  permission_handler: ^12.0.3
  # Local event-driven presentation feedback.
  lottie: ^3.3.3
  audioplayers: ^6.1.0
  package_info_plus: ^8.0.0
  shared_preferences: ^2.3.0
  path_provider: ^2.1.5
  phosphor_icons: ^3.0.1
  # Pixel-bearing camera frames are decoded locally for scene descriptors,
  # crop embeddings, and open-set region proposals. No frame leaves device.
  image: ^4.5.4
  # Event-driven vector feedback and a local glTF runtime for Tobi.
  rive: ^0.14.11
  flutter_3d_controller: ^2.3.0
  sqflite: ^2.4.4
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3
  sqflite_common_ffi: ^2.4.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/toy_vision_app_icon.png"
  adaptive_icon_background: "#1479FF"
  adaptive_icon_foreground: "assets/icons/tobi_ordena_app_icon_foreground.png"
  adaptive_icon_foreground_inset: 18
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/background/
    - assets/icons/
    - assets/images/
    - assets/mascots/
    - assets/lottie/
    - assets/rive/
    - assets/audio/
    - assets/models/
